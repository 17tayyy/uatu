name: uatu

x-app: &app
  build: .
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uatu}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uatu}

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uatu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-uatu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Only reachable from the host itself; use an SSH tunnel for QGIS etc.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]  # keep queued and scheduled tasks across restarts
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  recorder:
    <<: *app
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      RAW_ARCHIVE_DIR: /data/raw
    volumes:
      - rawdata:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    <<: *app
    command: ["ardiq", "run", "--quiet", "uatu.worker:app"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      REDIS_URL: redis://redis:6379
      SAR_DATA_DIR: /data/sar
      BACKUP_DIR: /data/backups
      REPORTS_DIR: /data/reports
      GDAL_CACHEMAX: "64"  # MB; by default GDAL takes 5% of the host's RAM, ignoring the container's limit
      MALLOC_ARENA_MAX: "2"  # GDAL's warper threads otherwise each keep an arena of freed memory
    volumes:
      - sardata:/data/sar
      - backups:/data/backups
      - reports:/data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 3000m  # two scenes at once take ~1.7 GB; never let them squeeze Postgres (4 GB container)
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  web:
    <<: *app
    # The dashboard. It has no authentication: the local network only, never forward this port.
    command: ["uvicorn", "uatu.web.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-env
      SAR_DATA_DIR: /data/sar
      WEB_CACHE_DIR: /data/web-cache
      REPORTS_DIR: /data/reports
    volumes:
      - sardata:/data/sar:ro  # radar overlays and the land mask, written by the worker
      - webcache:/data/web-cache  # optical chips, fetched on first request
      - reports:/data/reports:ro  # written by the worker every Monday
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 600m  # the land outlines of every zone are held in memory
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  webcache:
  pgdata:
  rawdata:
  redisdata:
  sardata:
  backups:
  reports:
