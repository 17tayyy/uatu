name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, migrations and tests
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: uatu
          POSTGRES_PASSWORD: uatu
          POSTGRES_DB: uatu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uatu -d uatu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://uatu:uatu@localhost:5432/uatu_test
      UATU_TEST_DATABASE_URL: postgresql+asyncpg://uatu:uatu@localhost:5432/uatu_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrate an empty PostGIS database
        run: uv run alembic upgrade head
      - name: Models and migrations agree
        run: uv run alembic check
      - name: Tests
        run: uv run pytest
